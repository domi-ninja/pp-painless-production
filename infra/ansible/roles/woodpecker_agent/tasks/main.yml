---
- name: Check runner isolation
  ansible.builtin.include_role:
    name: runner_guard

- name: Require Woodpecker agent secret
  ansible.builtin.assert:
    that:
      - woodpecker_agent_secret | length > 0
    fail_msg: "Set woodpecker_agent_secret with Ansible Vault or an ignored local vars file."

- name: Create Woodpecker agent directory
  ansible.builtin.file:
    path: "{{ woodpecker_agent_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install Woodpecker agent environment file
  ansible.builtin.template:
    src: woodpecker.env.j2
    dest: "{{ woodpecker_agent_app_dir }}/woodpecker.env"
    owner: root
    group: root
    mode: "0600"
  notify: restart woodpecker agent

- name: Install Woodpecker agent compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ woodpecker_agent_app_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: restart woodpecker agent

- name: Start Woodpecker agent stack
  ansible.builtin.command: "docker compose -f {{ woodpecker_agent_app_dir }}/compose.yml up -d"
  changed_when: true
