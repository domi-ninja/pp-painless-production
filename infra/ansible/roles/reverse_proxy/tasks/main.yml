---
- name: Keep the CLI route path consistent
  ansible.builtin.assert:
    that:
      - reverse_proxy_routes_dir == "/etc/pp/proxy/routes"
    fail_msg: "pp uses /etc/pp/proxy/routes. Keep reverse_proxy_routes_dir at that path."

- name: Create writable pp proxy directory
  ansible.builtin.file:
    path: /etc/pp/proxy
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"

- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Create pp proxy routes directory
  ansible.builtin.file:
    path: "{{ reverse_proxy_routes_dir }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"

- name: Ensure wildcard import has at least one route file
  ansible.builtin.copy:
    dest: "{{ reverse_proxy_routes_dir }}/00-empty.caddy"
    content: "# pp-managed routes are written beside this file.\n"
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Configure Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
  notify: Reload caddy

- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
