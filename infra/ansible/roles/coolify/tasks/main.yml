---
- name: Install Coolify prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - git
      - jq
      - openssl
      - wget
    state: present
    update_cache: true

- name: Check Docker version for Coolify
  ansible.builtin.command: docker version --format {% raw %}'{{.Server.Version}}'{% endraw %}
  register: coolify_docker_version
  changed_when: false

- name: Check Docker Compose plugin for Coolify
  ansible.builtin.command: docker compose version
  changed_when: false

- name: Create Coolify directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "9999"
    group: root
    mode: "0700"
  loop: "{{ coolify_required_directories }}"

- name: Find existing Coolify SSH private keys
  ansible.builtin.find:
    paths: "{{ coolify_base_dir }}/ssh/keys"
    patterns:
      - id.root@host.docker.internal
      - "ssh_key@*"
    excludes:
      - "*.lock"
      - "*.pub"
    file_type: file
  register: coolify_ssh_keys

- name: Generate bootstrap Coolify SSH key
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -f
      - "{{ coolify_base_dir }}/ssh/keys/id.root@host.docker.internal"
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - root@coolify
  when: coolify_ssh_keys.matched == 0

- name: Check bootstrap Coolify public SSH key
  ansible.builtin.stat:
    path: "{{ coolify_base_dir }}/ssh/keys/id.root@host.docker.internal.pub"
  register: coolify_public_key_file

- name: Ensure root SSH directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: coolify_public_key_file.stat.exists

- name: Read bootstrap Coolify public SSH key
  ansible.builtin.slurp:
    src: "{{ coolify_base_dir }}/ssh/keys/id.root@host.docker.internal.pub"
  register: coolify_public_key
  when: coolify_public_key_file.stat.exists

- name: Authorize Coolify root SSH key
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: "{{ coolify_public_key.content | b64decode | trim }}"
    create: true
    owner: root
    group: root
    mode: "0600"
  when: coolify_public_key_file.stat.exists

- name: Download Coolify Compose files
  ansible.builtin.get_url:
    url: "{{ coolify_cdn_base_url }}/{{ item }}"
    dest: "{{ coolify_source_dir }}/{{ item }}"
    owner: "9999"
    group: root
    mode: "0600"
    force: true
  loop: "{{ coolify_compose_files }}"

- name: Check Coolify environment file
  ansible.builtin.stat:
    path: "{{ coolify_source_dir }}/.env"
  register: coolify_env_file

- name: Download initial Coolify environment file
  ansible.builtin.get_url:
    url: "{{ coolify_cdn_base_url }}/.env.production"
    dest: "{{ coolify_source_dir }}/.env"
    owner: "9999"
    group: root
    mode: "0600"
    force: false
  when: not coolify_env_file.stat.exists

- name: Download Coolify upgrade script
  ansible.builtin.get_url:
    url: "{{ coolify_cdn_base_url }}/upgrade.sh"
    dest: "{{ coolify_source_dir }}/upgrade.sh"
    owner: "9999"
    group: root
    mode: "0700"
    force: true

- name: Generate first-install Coolify secrets
  ansible.builtin.command:
    argv:
      - openssl
      - rand
      - "{{ item.format }}"
      - "{{ item.length }}"
  register: coolify_generated_secrets
  changed_when: true
  no_log: true
  loop:
    - key: APP_ID
      format: -hex
      length: "16"
    - key: APP_KEY
      format: -base64
      length: "32"
    - key: DB_PASSWORD
      format: -base64
      length: "32"
    - key: REDIS_PASSWORD
      format: -base64
      length: "32"
    - key: PUSHER_APP_ID
      format: -hex
      length: "32"
    - key: PUSHER_APP_KEY
      format: -hex
      length: "32"
    - key: PUSHER_APP_SECRET
      format: -hex
      length: "32"
  when: not coolify_env_file.stat.exists

- name: Apply first-install Coolify secrets
  ansible.builtin.lineinfile:
    path: "{{ coolify_source_dir }}/.env"
    regexp: "^{{ item.item.key }}="
    line: "{{ item.item.key }}={{ 'base64:' if item.item.key == 'APP_KEY' else '' }}{{ item.stdout }}"
    owner: "9999"
    group: root
    mode: "0600"
  no_log: true
  loop: "{{ coolify_generated_secrets.results | default([]) }}"
  when: not coolify_env_file.stat.exists

- name: Configure Coolify application URL
  ansible.builtin.lineinfile:
    path: "{{ coolify_source_dir }}/.env"
    regexp: "^APP_URL="
    line: "APP_URL={{ coolify_app_url }}"
    owner: "9999"
    group: root
    mode: "0600"
  when: coolify_app_url | length > 0

- name: Configure Coolify local application bind port
  ansible.builtin.lineinfile:
    path: "{{ coolify_source_dir }}/.env"
    regexp: "^APP_PORT="
    line: "APP_PORT={{ coolify_app_port }}"
    owner: "9999"
    group: root
    mode: "0600"
  when: coolify_app_port | length > 0

- name: Require Coolify proxy hostname when UI proxy route is enabled
  ansible.builtin.assert:
    that:
      - coolify_proxy_hostname | length > 0
    fail_msg: "Set coolify_proxy_hostname when coolify_proxy_ui_enabled is true."
  when: coolify_proxy_ui_enabled | bool

- name: Install Coolify UI proxy route
  ansible.builtin.template:
    src: coolify-ui.yaml.j2
    dest: "{{ coolify_base_dir }}/proxy/dynamic/coolify-ui.yaml"
    owner: "9999"
    group: root
    mode: "0600"
  when: coolify_proxy_ui_enabled | bool

- name: Ensure Coolify source ownership
  ansible.builtin.file:
    path: "{{ coolify_base_dir }}"
    state: directory
    owner: "9999"
    group: root
    mode: "0700"
    recurse: true

- name: Check Coolify Docker network
  ansible.builtin.command: docker network inspect coolify
  register: coolify_network
  changed_when: false
  failed_when: false

- name: Create Coolify Docker network
  ansible.builtin.command: docker network create --attachable coolify
  when: coolify_network.rc != 0

- name: Start Coolify
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ coolify_source_dir }}/.env"
      - -f
      - "{{ coolify_source_dir }}/docker-compose.yml"
      - -f
      - "{{ coolify_source_dir }}/docker-compose.prod.yml"
      - up
      - -d
      - --pull
      - always
      - --remove-orphans
      - --force-recreate
  changed_when: true

- name: Wait for Coolify HTTP endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ coolify_app_port }}"
    follow_redirects: none
    status_code:
      - 200
      - 302
      - 303
      - 307
      - 308
  register: coolify_http_check
  retries: 30
  delay: 5
  until: coolify_http_check.status in [200, 302, 303, 307, 308]

- name: Check Coolify proxy compose file
  ansible.builtin.stat:
    path: "{{ coolify_proxy_compose_file }}"
  register: coolify_proxy_compose

- name: Recreate Coolify proxy to refresh Docker socket bind
  ansible.builtin.command: "docker compose -f {{ coolify_proxy_compose_file }} up -d --force-recreate"
  changed_when: true
  when: coolify_proxy_compose.stat.exists

- name: Count Coolify users
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - coolify
      - php
      - artisan
      - tinker
      - --execute=echo \App\Models\User::count();
  register: coolify_user_count
  changed_when: false

- name: Require Coolify admin credentials before first-admin creation
  ansible.builtin.assert:
    that:
      - coolify_admin_name | length > 0
      - coolify_admin_email | length > 0
      - coolify_admin_password | length > 0
    fail_msg: "Set coolify_admin_name, coolify_admin_email, and coolify_admin_password in an ignored credentials file."
  when:
    - coolify_admin_create_enabled | bool
    - coolify_user_count.stdout | int == 0
  no_log: true

- name: Create first Coolify admin
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - COOLIFY_ADMIN_NAME
      - -e
      - COOLIFY_ADMIN_EMAIL
      - -e
      - COOLIFY_ADMIN_PASSWORD
      - coolify
      - php
      - artisan
      - tinker
      - --execute=app(\App\Actions\Fortify\CreateNewUser::class)->create(['name' => getenv('COOLIFY_ADMIN_NAME'), 'email' => getenv('COOLIFY_ADMIN_EMAIL'), 'password' => getenv('COOLIFY_ADMIN_PASSWORD'), 'password_confirmation' => getenv('COOLIFY_ADMIN_PASSWORD')]);
  environment:
    COOLIFY_ADMIN_NAME: "{{ coolify_admin_name }}"
    COOLIFY_ADMIN_EMAIL: "{{ coolify_admin_email }}"
    COOLIFY_ADMIN_PASSWORD: "{{ coolify_admin_password }}"
  when:
    - coolify_admin_create_enabled | bool
    - coolify_user_count.stdout | int == 0
  no_log: true

- name: Verify configured Coolify admin exists
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - COOLIFY_ADMIN_EMAIL
      - coolify
      - php
      - artisan
      - tinker
      - --execute=echo \App\Models\User::where('email', getenv('COOLIFY_ADMIN_EMAIL'))->count();
  environment:
    COOLIFY_ADMIN_EMAIL: "{{ coolify_admin_email }}"
  register: coolify_admin_count
  changed_when: false
  failed_when: coolify_admin_count.stdout | int != 1
  when:
    - coolify_admin_create_enabled | bool
    - coolify_admin_email | length > 0
  no_log: true

- name: Ensure Coolify default project and complete onboarding
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "COOLIFY_DEFAULT_PROJECT_NAME={{ coolify_default_project_name }}"
      - coolify
      - php
      - artisan
      - tinker
      - >-
        --execute=$team = \App\Models\Team::findOrFail(0); $server = \App\Models\Server::find(0); if ($server && $server->settings) { $server->settings()->update(['is_reachable' => true, 'is_usable' => true]); } $project = \App\Models\Project::where('team_id', $team->id)->first(); if (! $project) { $project = \App\Models\Project::create(['name' => getenv('COOLIFY_DEFAULT_PROJECT_NAME') ?: 'Default', 'team_id' => $team->id, 'uuid' => (string) new \Visus\Cuid2\Cuid2]); } $team->show_boarding = false; $team->save(); echo $project->uuid;
  register: coolify_default_project
  changed_when: false
  when: coolify_default_project_enabled | bool

- name: Apply configured Coolify application overrides
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "COOLIFY_APP_UUID={{ item.uuid }}"
      - -e
      - "COOLIFY_APP_GIT_REPOSITORY={{ item.git_repository | default('') }}"
      - -e
      - "COOLIFY_APP_GIT_BRANCH={{ item.git_branch | default('') }}"
      - -e
      - "COOLIFY_APP_FQDN={{ item.fqdn | default('') }}"
      - coolify
      - php
      - artisan
      - tinker
      - >-
        --execute=$app = \App\Models\Application::where('uuid', getenv('COOLIFY_APP_UUID'))->firstOrFail(); $changed = false; foreach (['git_repository' => 'COOLIFY_APP_GIT_REPOSITORY', 'git_branch' => 'COOLIFY_APP_GIT_BRANCH', 'fqdn' => 'COOLIFY_APP_FQDN'] as $field => $env) { $value = getenv($env); if ($value !== false && $value !== '' && $app->{$field} !== $value) { $app->{$field} = $value; $changed = true; } } if ($changed) { $app->save(); echo 'changed'; } else { echo 'ok'; }
  register: coolify_application_override_results
  changed_when: "'changed' in coolify_application_override_results.stdout"
  loop: "{{ coolify_application_overrides }}"
  loop_control:
    label: "{{ item.uuid }}"
  tags:
    - coolify_application_overrides
