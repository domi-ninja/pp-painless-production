---
- name: Install Docker configuration and relocation helper
  ansible.builtin.copy:
    src: relocate-docker.py
    dest: /usr/local/lib/pp/relocate-docker.py
    owner: root
    group: root
    mode: "0755"

- name: Apply Docker configuration with recoverable storage relocation
  ansible.builtin.command:
    argv: [/usr/local/lib/pp/relocate-docker.py]
    stdin: "{{ {'relocate': docker_data_root_enabled | bool, 'target': docker_data_root_path, 'backup_confirmed': docker_data_root_backup_confirmed | bool, 'daemon_config': docker_daemon_config} | to_json }}"
  register: pp_docker_configuration
  changed_when: "pp_docker_configuration.stdout == 'changed'"
  failed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Report Docker configuration errors without echoing settings
  ansible.builtin.assert:
    that:
      - pp_docker_configuration.rc == 0
    fail_msg: "Docker configuration failed: {{ pp_docker_configuration.stderr }}"
  when: not ansible_check_mode
