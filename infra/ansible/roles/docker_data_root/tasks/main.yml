---
- name: Require absolute Docker data root path
  ansible.builtin.assert:
    that:
      - docker_data_root_path.startswith('/')
      - docker_data_root_path != '/'
    fail_msg: "docker_data_root_path must be an absolute non-root path."

- name: Check Docker CLI is available
  ansible.builtin.command: docker --version
  changed_when: false

- name: Read current Docker data root
  ansible.builtin.command: docker info --format {% raw %}'{{.DockerRootDir}}'{% endraw %}
  register: docker_current_root
  changed_when: false

- name: Resolve Docker data root paths
  ansible.builtin.command:
    argv:
      - realpath
      - -m
      - --
      - "{{ docker_current_root.stdout }}"
      - "{{ docker_data_root_path }}"
  register: docker_resolved_roots
  changed_when: false

- name: Record canonical Docker data root paths
  ansible.builtin.set_fact:
    docker_data_root_source: "{{ docker_resolved_roots.stdout_lines[0] }}"
    docker_data_root_target: "{{ docker_resolved_roots.stdout_lines[1] }}"

- name: Reject overlapping Docker data roots
  ansible.builtin.assert:
    that:
      - docker_resolved_roots.stdout_lines | length == 2
      - docker_data_root_source != '/'
      - docker_data_root_target != '/'
      - >-
        docker_data_root_source == docker_data_root_target or
        (not docker_data_root_source.startswith(docker_data_root_target + '/') and
         not docker_data_root_target.startswith(docker_data_root_source + '/'))
    fail_msg: "Docker data roots must be non-root paths that are identical or do not contain one another."

- name: Reject ambiguous mount layouts before moving Docker data
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json
        import os
        import subprocess
        import sys

        def mounts(*options):
            output = subprocess.check_output(
                ["findmnt", "--json", "--output", "TARGET,FSROOT,MAJ:MIN", *options],
                text=True,
            )
            return json.loads(output)["filesystems"]

        all_mounts = mounts("--list")
        for path in sys.argv[1:]:
            while not os.path.exists(path):
                path = os.path.dirname(path)
            mount = mounts("--target", path)[0]
            root_aliases = sum(
                entry["maj:min"] == mount["maj:min"] and entry["fsroot"] == "/"
                for entry in all_mounts
            )
            if mount["fsroot"] != "/" or root_aliases > 1:
                sys.exit("Docker data-root moves require direct, unaliased filesystem mounts; bind mounts and subvolume aliases are unsupported.")
      - "{{ docker_data_root_source }}"
      - "{{ docker_data_root_target }}"
  changed_when: false
  when: docker_data_root_source != docker_data_root_target

- name: Ensure Docker data root directory exists
  ansible.builtin.file:
    path: "{{ docker_data_root_target }}"
    state: directory
    owner: root
    group: root
    mode: "0711"

- name: Stop Docker before moving data root
  ansible.builtin.systemd:
    name: docker
    state: stopped
  when: docker_data_root_source != docker_data_root_target

- name: Stop Docker socket before moving data root
  ansible.builtin.systemd:
    name: docker.socket
    state: stopped
  failed_when: false
  when: docker_data_root_source != docker_data_root_target

- name: Copy existing Docker state into new data root
  ansible.builtin.command:
    argv:
      - rsync
      - -aHAX
      - --numeric-ids
      - "{{ docker_data_root_source }}/"
      - "{{ docker_data_root_target }}/"
  when: docker_data_root_source != docker_data_root_target

- name: Install Docker daemon config with data-root
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_data_root_config | combine({'data-root': docker_data_root_target}) | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: restart docker

- name: Start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Flush Docker restart if daemon config changed
  ansible.builtin.meta: flush_handlers

- name: Verify Docker is using configured data root
  ansible.builtin.command: docker info --format {% raw %}'{{.DockerRootDir}}'{% endraw %}
  register: docker_verified_root
  changed_when: false
  failed_when: docker_verified_root.stdout != docker_data_root_target
