---
- name: Provision a dedicated CI runner VM
  hosts: runner_servers
  become: true
  pre_tasks:
    - name: Require a separate runner host
      ansible.builtin.assert:
        that:
          - ci_runner_isolated_host | default(false) | bool
          - "'prod_servers' not in group_names"
        fail_msg: "Set ci_runner_isolated_host: true only for a dedicated runner VM, outside prod_servers."
  roles:
    - role: base
    - role: docker
    - role: forgejo_runner
      when: forgejo_runner_enabled | default(false) | bool
    - role: woodpecker_agent
      when: woodpecker_agent_enabled | default(false) | bool
