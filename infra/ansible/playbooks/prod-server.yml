---
- name: Provision Ubuntu production server
  hosts: prod_servers
  become: true
  pre_tasks:
    - name: Refuse CI runners on production hosts
      ansible.builtin.assert:
        that:
          - not (forgejo_runner_enabled | default(false) | bool)
          - not (woodpecker_agent_enabled | default(false) | bool)
        fail_msg: "CI runners require a dedicated VM. Use runner-server.yml with the runner_servers inventory group."

    - name: Load ignored host credentials when present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}.credentials.local.yml"
      failed_when: false
      no_log: true

  roles:
    - role: base
    - role: data_volume
      when: data_volume_enabled | bool
    - role: docker
      when: docker_enabled | bool
    - role: docker_data_root
      when: docker_data_root_enabled | bool
    - role: coolify
      when: coolify_enabled | bool
    - role: reverse_proxy
      when: reverse_proxy_enabled | bool
    - role: forgejo
      when: forgejo_enabled | bool
    - role: forgejo_runner
      when: forgejo_runner_enabled | bool
    - role: woodpecker_agent
      when: woodpecker_agent_enabled | bool
