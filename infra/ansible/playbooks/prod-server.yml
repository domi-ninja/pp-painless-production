---
- name: Provision Ubuntu production server
  hosts: prod_servers
  become: true
  pre_tasks:
    - name: Refuse Git hosting and CI roles in the application playbook
      ansible.builtin.assert:
        that:
          - not (forgejo_enabled | default(false) | bool)
          - not (forgejo_runner_enabled | default(false) | bool)
          - not (woodpecker_agent_enabled | default(false) | bool)
        fail_msg: "Git hosting and CI moved to git-host-ansible. Use its playbooks; CI still requires a dedicated VM."

    - name: Load ignored host credentials when present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}.credentials.local.yml"
      failed_when: false
      no_log: true

  roles:
    - role: base
    - role: data_volume
      when: data_volume_enabled | bool
    - role: docker
      when: docker_enabled | bool
    - role: docker_data_root
      when: docker_data_root_enabled | bool
    - role: coolify
      when: coolify_enabled | bool
    - role: reverse_proxy
      when: reverse_proxy_enabled | bool
