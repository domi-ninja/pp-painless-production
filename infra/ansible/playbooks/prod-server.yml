---
- name: Provision Ubuntu production server
  hosts: prod_servers
  become: true
  pre_tasks:
    - name: Refuse unsupported platform roles in the application playbook
      ansible.builtin.assert:
        that:
          - not (coolify_enabled | default(false) | bool)
          - not (reverse_proxy_stop_coolify_proxy | default(false) | bool)
          - not (forgejo_enabled | default(false) | bool)
          - not (forgejo_runner_enabled | default(false) | bool)
          - not (woodpecker_agent_enabled | default(false) | bool)
        fail_msg: "This playbook supports pp application hosts. Remove legacy Coolify flags; use separate playbooks for Git hosting and CI."

    - name: Load ignored host credentials when present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}.credentials.local.yml"
      failed_when: false
      no_log: true

  roles:
    - role: base
    - role: data_volume
      when: data_volume_enabled | bool
    - role: docker
      when: docker_enabled | bool
    - role: reverse_proxy
      when: reverse_proxy_enabled | bool
