version: 1

project:
  name: convex-website
  environment: prod

env:
  source: .env.local
  required:
    - VITE_CONVEX_URL
    - SITE_URL
    - CONVEX_SELF_HOSTED_URL
    - INSTANCE_NAME
    - INSTANCE_SECRET
    - POSTGRES_DB
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_URL
    - MINIO_ROOT_USER
    - MINIO_ROOT_PASSWORD
    - S3_STORAGE_EXPORTS_BUCKET
    - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET
    - S3_STORAGE_MODULES_BUCKET
    - S3_STORAGE_FILES_BUCKET
    - S3_STORAGE_SEARCH_BUCKET

builds:
  postgres:
    context: deploy/postgres
    dockerfile: deploy/postgres/Dockerfile
    tags:
      - convex-website-postgres:${release}
  web:
    context: .
    dockerfile: Dockerfile
    target: runtime
    tags:
      - convex-website-web:${release}
    args:
      VITE_CONVEX_URL: ${env.VITE_CONVEX_URL}

hosts:
  server:
    ssh: deploy@example.com
    roles: [web, convex]

services:
  postgres:
    image: convex-website-postgres:${release}
    build: postgres
    phase: infra
    hosts: [server]
    env:
      source: .env.local
      required:
        - POSTGRES_DB
        - POSTGRES_USER
        - POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: ${env.POSTGRES_DB}
      POSTGRES_USER: ${env.POSTGRES_USER}
      POSTGRES_PASSWORD: ${env.POSTGRES_PASSWORD}
    volumes:
      - source: /data/pp/convex-website/postgres
        target: /var/lib/postgresql/data
        type: bind
    health:
      command:
        ["pg_isready", "-h", "127.0.0.1", "-U", "${env.POSTGRES_USER}", "-d", "${env.POSTGRES_DB}"]
      timeout_seconds: 60

  s3:
    image: minio/minio:latest
    pull: if_missing
    phase: infra
    hosts: [server]
    command: ["server", "/data", "--console-address", ":9001"]
    env:
      source: .env.local
      required:
        - MINIO_ROOT_USER
        - MINIO_ROOT_PASSWORD
    environment:
      MINIO_ROOT_USER: ${env.MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${env.MINIO_ROOT_PASSWORD}
    volumes:
      - source: /data/pp/convex-website/s3
        target: /data
        type: bind

  convex-backend:
    image: ghcr.io/get-convex/convex-backend:latest
    pull: if_missing
    phase: backend
    hosts: [server]
    env:
      source: .env.local
      required:
        - INSTANCE_NAME
        - INSTANCE_SECRET
        - POSTGRES_URL
        - MINIO_ROOT_USER
        - MINIO_ROOT_PASSWORD
        - S3_STORAGE_EXPORTS_BUCKET
        - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET
        - S3_STORAGE_MODULES_BUCKET
        - S3_STORAGE_FILES_BUCKET
        - S3_STORAGE_SEARCH_BUCKET
    environment:
      INSTANCE_NAME: ${env.INSTANCE_NAME}
      INSTANCE_SECRET: ${env.INSTANCE_SECRET}
      CONVEX_CLOUD_ORIGIN: ${env.CONVEX_SELF_HOSTED_URL}
      CONVEX_SITE_ORIGIN: ${env.CONVEX_SELF_HOSTED_URL}
      POSTGRES_URL: ${env.POSTGRES_URL}
      DO_NOT_REQUIRE_SSL: "1"
      RUST_LOG: info
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${env.MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${env.MINIO_ROOT_PASSWORD}
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_S3_DISABLE_SSE: "true"
      S3_ENDPOINT_URL: http://s3:9000
      S3_STORAGE_EXPORTS_BUCKET: ${env.S3_STORAGE_EXPORTS_BUCKET}
      S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET: ${env.S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET}
      S3_STORAGE_MODULES_BUCKET: ${env.S3_STORAGE_MODULES_BUCKET}
      S3_STORAGE_FILES_BUCKET: ${env.S3_STORAGE_FILES_BUCKET}
      S3_STORAGE_SEARCH_BUCKET: ${env.S3_STORAGE_SEARCH_BUCKET}
    ports:
      - published: auto
        target: 3210
      - published: auto
        target: 3211
    health:
      command: ["curl", "-sf", "http://127.0.0.1:3210/version"]
      timeout_seconds: 90

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    pull: if_missing
    phase: backend
    hosts: [server]
    environment:
      PORT: "3211"
      CONVEX_CLOUD_ORIGIN: ${env.CONVEX_SELF_HOSTED_URL}
      NEXT_PUBLIC_DEPLOYMENT_URL: ${env.CONVEX_SELF_HOSTED_URL}
      CONVEX_SITE_ORIGIN: ${env.CONVEX_SELF_HOSTED_URL}
    ports:
      - published: auto
        target: 3211
    health:
      command:
        [
          "node",
          "-e",
          "fetch('http://127.0.0.1:3211/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      timeout_seconds: 90

  web:
    image: convex-website-web:${release}
    build: web
    phase: frontend
    hosts: [server]
    ports:
      - published: auto
        target: 80
    health:
      command: ["wget", "-q", "--spider", "http://127.0.0.1/"]
      timeout_seconds: 60

route_files:
  - source: deploy/caddy/convex-website.caddy.tmpl
    host: server
    dest_name: convex-website.caddy

hooks:
  after_backend_healthy:
    - name: ensure minio buckets
      run: ["bash", "scripts/ensure-minio-buckets.sh"]
      env:
        source: .env.local
        required:
          - S3_STORAGE_EXPORTS_BUCKET
          - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET
          - S3_STORAGE_MODULES_BUCKET
          - S3_STORAGE_FILES_BUCKET
          - S3_STORAGE_SEARCH_BUCKET
    - name: refresh convex admin key
      run: ["bash", "scripts/refresh-convex-admin-key.sh"]
      env:
        source: .env.local
        required:
          - CONVEX_SELF_HOSTED_URL
    - name: push convex env
      run: ["bash", "scripts/push-env-to-convex.sh"]
      env:
        source: .env.local
        required:
          - CONVEX_SELF_HOSTED_URL
          - SITE_URL
          - JWT_PRIVATE_KEY
          - JWKS
    - name: sync convex functions
      run: ["npx", "convex", "dev", "--once", "--env-file", ".env.local"]
      env:
        source: .env.local
        required:
          - CONVEX_SELF_HOSTED_URL

checks:
  smoke:
    - name: frontend
      url: https://convex.example.com/
      expect_status: 200
    - name: convex version
      url: https://api.convex.example.com/version
      expect_status: 200
