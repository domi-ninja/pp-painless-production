version: 1

project:
  name: simple-website
  environment: prod

build:
  context: .
  dockerfile: Dockerfile
  tags:
    - "simple-website:${release}"

hosts:
  server:
    ssh: deploy@example.com
    roles: [web]

services:
  web:
    image: "simple-website:${release}"
    hosts: [server]
    ports:
      - host_ip: 127.0.0.1
        published: auto
        target: 80
    health:
      command: ["wget", "-q", "--spider", "http://127.0.0.1/"]
      timeout_seconds: 60

routes:
  - host: simple.example.com
    service: web

checks:
  smoke:
    - name: frontend
      url: https://simple.example.com/
      expect_status: 200
