version: 1

project:
  name: stateful-go-website
  environment: prod

build:
  context: .
  dockerfile: Dockerfile
  tags:
    - "stateful-go-website:${release}"

hosts:
  server:
    ssh: deploy@example.com
    roles: [web]

services:
  web:
    image: "stateful-go-website:${release}"
    hosts: [server]
    env:
      source: ".env"
      required: ["JWT_SECRET"]
    ports:
      - published: auto
        target: 5000
    volumes:
      - name: stateful-go-website-data
        target: /data
    health:
      command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/health"]
      timeout_seconds: 60

routes:
  - host: stateful.example.com
    service: web

volumes:
  stateful-go-website-data:
    driver: local

checks:
  smoke:
    - name: public health
      url: https://stateful.example.com/health
      expect_status: 200
